name: Make Apk CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

jobs:
  Build-Apk:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Restore debug keystore from GitHub Secrets
      run: |
        # Check if exist and use the secret named DEBUG_KEYSTORE
        # The contents of the secret can be obtained -
        #  from the debug.keystore.asc from you local folder 
        #  (refer to CONTRIBUTING.md Using the local debug.keystore on the Github CI actions)
        if [[ ! "${{ secrets.DEBUG_KEYSTORE }}" = "" ]]; then
            echo "${{ secrets.DEBUG_KEYSTORE }}" > "debug.keystore.asc"
            if [[ -s "debug.keystore.asc" ]]; then
                echo "Restoring debug keystore from GitHub secrets"
                gpg -d --passphrase "debug0" --batch "debug.keystore.asc" > "debug.keystore"
            fi
        fi

    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: 8.14.4

    - name: Run tests
      run: gradle test

    - name: Build debug APK
      run: gradle assembleDebug
      env:
        DEBUG_KEYSTORE: "debug.keystore"
        DEBUG_KEYSTORE_PASSWORD: debug0
        DEBUG_KEY_ALIAS: debug
        DEBUG_KEY_PASSWORD: debug0

    - name: Upload debug APK
      id: upload
      uses: actions/upload-artifact@v7
      with:
        name: "Unexpected-Keyboard-debug-${{ github.sha }}"
        path: build/outputs/apk/debug/*.apk

    - name: Check generated files
      run:
        git diff --name-only --exit-code

    # Post link to debug APK as a comment
    # https://octokit.github.io/rest.js/v22/
    - name: Post artifact
      uses: actions/github-script@v9
      if: ${{ github.event_name == 'pull_request' }}
      with:
        script: |
          const args = {
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo
          };
          const body = 'Debug build (${{ github.event.pull_request.head.sha }}): ${{ steps.upload.outputs.artifact-url }}';
          // Update the existing comment if there's one
          const comments = await github.paginate(github.rest.issues.listComments, args);
          for (const cmt of comments)
          {
            if (cmt.user.login == 'github-actions[bot]' && cmt.body.includes("Debug build "))
            {
              await github.rest.issues.updateComment({ ...args, comment_id: cmt.id, body: body });
              return;
            }
          }
          // Post comment
          await github.rest.issues.createComment({ ...args, body: body })
